<p>modal-accessible works!</p>

<button  #triggerBtn (click)="openModal()">apri modale</button>

@if (isOpen()) {
    <div class="backdrop">
        <div #dialogContainer class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="wbutton">
                <button (click)="closeModal()" aria-label="Chiudi finestra">✕</button>
            </div>
            <h2 id="modal-title" #dialogTitle tabindex="-1">Modale accessibile</h2>
            <p>Contenuto della finestra di dialogo.</p>
        </div>
    </div>
}
